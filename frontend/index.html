<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235ad8b1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 3a9 9 0 1 0 9 9'/><circle cx='12' cy='12' r='4'/><circle cx='17.2' cy='6.8' r='1.25' fill='%23b0f7f6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PrivateRAG — Secure Knowledge Workspace</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('dars_rag_theme') || 'dark';
          if (t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground antialiased selection:bg-neutral-800 selection:text-neutral-100 overflow-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
